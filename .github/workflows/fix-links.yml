name: Use custom domains in landing links
on:
  push:
    paths:
      - '.github/workflows/fix-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace netlify.app links with custom domains and clean up
        run: |
          grep -q 'plastic-eurosol.netlify.app' index.html
          sed -i 's#https://plastic-eurosol\.netlify\.app#https://plastic.eurosol.hu#g; s#https://eurosol-racing-team-hungary\.netlify\.app#https://rally.eurosol.hu#g' index.html README.md
          ! grep -q 'netlify\.app' index.html
          git rm -q .github/workflows/fix-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link to plastic.eurosol.hu and rally.eurosol.hu instead of netlify.app"
          git push
